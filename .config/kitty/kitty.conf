window_padding_width 10 15
confirm_os_window_close 0
scrollbar scrolled

box_drawing_scale 0.5, 0.5, 1.2, 1.5
progress_bar hidden

cursor_shape block
cursor_trail_start_threshold 0
cursor_trail 1


font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF features='calt zero cv04 cv14 cv16 cv18 cv19 cv20'
bold_font        family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Bold features='calt zero cv04 cv14 cv16 cv18 cv19 cv20'
italic_font      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-LightItalic features='calt zero cv04 cv14 cv16 cv18 cv19 cv20'
bold_italic_font family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-BoldItalic features='calt zero cv04 cv14 cv16 cv18 cv19 cv20'
font_size        11.5


allow_remote_control yes
copy_on_select yes
auto_reload_config 0.1


map ctrl+shift+w>h neighboring_window left
map ctrl+shift+w>l neighboring_window right
map ctrl+shift+w>j neighboring_window down
map ctrl+shift+w>k neighboring_window up

map ctrl+shift+w>shift+h move_window left
map ctrl+shift+w>shift+l move_window right
map ctrl+shift+w>shift+j move_window down
map ctrl+shift+w>shift+k move_window up

map ctrl+shift+w>s launch --location=hsplit
map ctrl+shift+w>v launch --location=vsplit






















# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
