[backdrop]
enabled = true

[bar.default]
background_opacity = 0.79999998211860657
center = [ "clock", "text_2", "date" ]
color = "primary"
end = [ "volume", "audio_visualizer", "spacer_3", "network", "spacer_9", "battery", "spacer_8", "session" ]
font_family = "Inter"
margin_ends = 5
padding = 10
position = "left"
scale = 0.85000000521540642
start = [
    "launcher",
    "spacer_6",
    "workspaces",
    "spacer_7",
    "notifications",
    "spacer_2",
    "spacer_5",
    "cpu",
    "spacer_4",
    "ram",
    "sysmon"
]
thickness = 36
widget_spacing = 6

[control_center]
hidden_tabs = [ "weather" ]
sidebar = "full"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[keybinds]
down = [ "Ctrl+j" ]
left = [ "Ctrl+h" ]
right = [ "Ctrl+l" ]
up = [ "Ctrl+k" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 384.0
    cx = 768.0
    cy = 525.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.59999999999999998
        input_radius = 32.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 384.0
    cx = 768.0
    cy = 368.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 128.0
    cx = 768.0
    cy = 456.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "label"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        shadow = false
        title = "Edgerunner"

[notification]
background_opacity = 0.79999998211860657
border_color = "on_secondary"

[osd]
background_opacity = 0.79999998211860657
border_color = "on_secondary"
offset_y = 42
position = "bottom_center"

[plugin_settings."noctalia/wallhaven"]
api_key = "QWTIQOrVuo1GazaCAMrTIVwtJ76GQua5"
browser_placement = "floating"
browser_position = "center"
download_dir = "/home/edgerunner/Downloads/wallpapers"

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/edgerunner/Downloads/zai007-552.jpg"
button_borders = false
card_borders = false
font_family = "Inter"
input_borders = false

    [shell.launcher]
    categories = false
    layout = "simple"

    [shell.panel]
    border_color = "on_secondary"
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "attached"
    session_position = "auto"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.session]
    grid = true
    grid_columns = 1
    show_shortcuts = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "l"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "o"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "u"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "r"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "s"
        variant = "destructive"

    [shell.shadow]
    alpha = 0.4999999888241291

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "niri" ]
    community_ids = [ "pywalfox", "bat", "yazi" ]

        [theme.templates.user.nvim]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/nvim.json"
        output_path = "$XDG_CONFIG_HOME/nvim/colors.json"
        post_hook = "pkill -SIGUSR1 nvim || true"

[wallpaper]
directory = "/home/edgerunner/Downloads/wallpapers"

    [wallpaper.default]
    path = "/home/edgerunner/Downloads/wallpapers/al-qin-sentinels-camile14.jpg"

    [wallpaper.last]
    path = "/home/edgerunner/Downloads/wallpapers/al-qin-sentinels-camile14.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/edgerunner/Downloads/wallpapers/al-qin-sentinels-camile14.jpg"

[widget.audio_visualizer]
bands = 20
scale = 0.69999999999999996
