[general]
mode = 'waves'
bars = 0
bar_width = 1
bar_spacing = 1

[input]
method = pulse
source = auto
method = pipewire
source = auto

[color]
foreground = "{{ colors.inverse_primary.default.hex | to_color | set_lightness: 60 | set_saturation: 40.0 }}"
gradient = 0
horizontal_gradient = 1
horizontal_gradient_color_1 = '{{colors.primary_container.default.hex}}'
horizontal_gradient_color_2 = '{{colors.primary.default.hex}}'
horizontal_gradient_color_3 = '{{colors.primary_fixed.default.hex}}'
horizontal_gradient_color_4 = '{{colors.primary.default.hex}}'
horizontal_gradient_color_5 = '{{colors.primary_container.default.hex}}'
