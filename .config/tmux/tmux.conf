# ── General ───────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

set -g history-limit 50000

set -g display-time 2000

set -s focus-events on

bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# ── Copy mode and clipboard ───────────────────────────────────────────
# vi keys in copy mode (h/j/k/l, /, ?, w, b ...)
setw -g mode-keys vi
# Vim-like selection: v starts, Ctrl+v toggles block mode, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

set -s set-clipboard on

# ── Panes and windows ─────────────────────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Monitor and highlight background windows on bell
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off
setw -g window-status-bell-style ''

# Forward terminal bells and OSC notifications from background panes
set -g allow-passthrough all

# ── Status line ───────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5

# ── Colors and terminal ───────────────────────────────────────────────
set -as terminal-features ",xterm-256color:RGB"

# ── Load theme ────────────────────────────────────────────────────────
source-file ~/.config/tmux/noctalia.conf

set -g status on
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=#{@bg},fg=#{@on_surface}"
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-current-style nounderscore

set -g status-left '#[bg=#{@bg},fg=#{?client_prefix,#{@accent_alt},#{@accent}}]#[bg=#{?client_prefix,#{@accent_alt},#{@accent}},fg=#{@surface},bold] #{?client_prefix,󰌌 , }#[bg=#{@surface},fg=#{?client_prefix,#{@accent_alt},#{@accent}}]#[bg=#{@surface},fg=#{?client_prefix,#{@accent_alt},#{@accent}},bold] #{?client_prefix,prefix,#S} #[bg=#{@bg},fg=#{@surface}] '

set -g window-status-separator "#[fg=#{@bg},bg=#{@bg}] "
  set -g window-status-format '#[bg=#{@bg},fg=#{@surface}]#[bg=#{@surface},fg=#{@accent},bold] #{?window_bell_flag,󰂞 ,}#W #[bg=#{@surface},fg=#{@accent}]#[bg=#{@accent},fg=#{@surface},bold] #I #[bg=#{@bg},fg=#{@accent}]'
set -g window-status-current-format "#[bg=#{@bg},fg=#{@surface}]#[bg=#{@surface},fg=#{@accent_alt},bold] #W #{?window_zoomed_flag,󰭎 ,}#[bg=#{@surface},fg=#{@accent_alt}]#[bg=#{@accent_alt},fg=#{@surface},bold] #I #[bg=#{@bg},fg=#{@accent_alt}]"

set -g status-right ""

set -g pane-border-style "fg=#{@surface}"
set -g pane-active-border-style "fg=#{@accent}"

set -g message-style "bg=#{@surface},fg=#{@on_surface}"
set -g message-command-style "bg=#{@surface},fg=#{@on_surface}"
set -g message-format '#[bg=#{@bg},fg=#{@surface}]#[bg=#{@surface},fg=#{@accent},bold] 󰋼 #{message} #[bg=#{@bg},fg=#{@surface}] '

set -g mode-style "bg=#{@surface},fg=#{@on_surface}"

set -g clock-mode-colour "#{@accent}"
set -g clock-mode-style 24

set -g display-panes-colour "#{@surface}"
set -g display-panes-active-colour "#{@accent}"

set -g status 2
set -g status-format[1] '#[bg=#{@bg},fg=#{@line}]#(printf "─%.0s" $(seq 1 #{client_width}))'
