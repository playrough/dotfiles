[appearance]
theme = "noctalia"

border_focused_color = "accent"
border_unfocused_color = "surface"

modal_dim = 5
session_colors = false
shared_borders = true
border_style = "normal"
motion = "none"

[appearance.sidebar]
enabled = false
sections = "sessions,terminals,agents,git"
density = "roomy"
show_glyphs = false
peek = false

[startup]
layout = "master-stack"
tiled = true
daemon = true

[dock]
left = ["workspaces"]
right = ["notifications"]

[dock.tabs]
style = "pill"
separator = ""

active_fg = "bg"
active_bg = "accent"
active_bold = true
active_underline = false
inactive_fg = "accent"
inactive_bold = true

[agents]
enabled = true

[spotlight]
enabled = false

[keybindings]
leader_key = ""
preset = "tmux"

[keybindings.prefix_mode]
terminal_focus_left = ["h", "left"]
focus_down = ["j", "down"]
focus_up = ["k", "up"]
terminal_focus_right = ["l", "right"]

# unset j and k
prefix_jump_notif = []
prefix_keybinds = []
