[appearance]
theme = "noctalia"

border_focused_color = "accent"
border_unfocused_color = "surface"

modal_dim = 5
session_colors = false
shared_borders = true
border_style = "normal"

[appearance.sidebar]
enabled = true
sections = "sessions,terminals,agents,git"
density = "roomy"
show_glyphs = false

[startup]
layout = "master-stack"
tiled = true
daemon = true

[motion]
layout = "off"
workspace = "none"
zoom = "off"
overlays = "off"

[dock]
left = ["workspaces"]
right = ["notifications"]

[dock.tabs]
style = "pill"
separator = ""

active_fg = "bg"
active_bg = "accent"
active_bold = true
active_underline = false
inactive_fg = "accent"
inactive_bold = true

[agents]
enabled = true

[spotlight]
enabled = false

[notifications.agent]
notify = true
enabled = true
dock = false
