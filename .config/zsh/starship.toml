"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

[line_break]
disabled = true

[cmd_duration]
disabled = true

[character]
success_symbol = '[ ](bold green)'
error_symbol   = '[ ](bold red)'
vimcmd_symbol  = '[ ](bold yellow)'

[directory]
format = "[$read_only]($read_only_style) [$path]($style) "
style = "bold yellow"
read_only = " 󰉐"
read_only_style = "bold red"
truncation_symbol = "…/"

[package]
disabled = true

scan_timeout = 300
